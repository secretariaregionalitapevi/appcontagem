<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1, shrink-to-fit=no, maximum-scale=1, user-scalable=0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Configurações Dinâmicas da Regional -->
    <script src="/config.js"></script>
    
    <meta name="apple-mobile-web-app-title" content="CCB Contagem" />
    <title>CCB Contagem</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- PWA Manifest and Icons (matching CCB Agenda exactly) -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="icon" href="/icons/icon-192.png" />

    <!-- The `react-native-web` recommended style reset -->
    <style id="expo-reset">
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #f3f3f4;
        }

        body {
            overflow: hidden;
            /* Disable pull-to-refresh behavior on body to allow in-app scrollviews to handle it */
            overscroll-behavior-y: none;
        }

        #root {
            display: flex;
            height: 100%;
            flex: 1;
        }

        /* Forçar fontes nos alertas SweetAlert2 com máxima especificidade conforme modelo */
        .swal2-container, .swal2-popup, .swal2-toast {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
        }
        
        .swal2-title {
            font-family: 'Outfit', sans-serif !important;
            font-weight: 700 !important;
            color: #1e293b !important; /* Slate 800 */
            font-size: 26px !important;
            padding-top: 15px !important;
            letter-spacing: -0.5px !important;
            line-height: 1.2 !important;
        }

        .swal2-html-container {
            font-family: 'Inter', sans-serif !important;
            color: #64748b !important; /* Slate 500 */
            font-size: 16px !important;
            margin-top: 12px !important;
            line-height: 1.6 !important;
            font-weight: 400 !important;
        }

        .swal2-popup {
            border-radius: 24px !important;
            padding: 2rem !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15) !important;
            border: 1px solid rgba(0,0,0,0.05) !important;
        }

        .swal2-confirm {
            border-radius: 16px !important;
            font-weight: 700 !important;
            padding: 12px 32px !important;
            font-size: 16px !important;
            font-family: 'Inter', sans-serif !important;
            transition: all 0.2s ease !important;
        }

        .swal2-cancel {
            border-radius: 16px !important;
            font-weight: 600 !important;
            padding: 12px 32px !important;
            font-size: 16px !important;
            font-family: 'Inter', sans-serif !important;
            transition: all 0.2s ease !important;
        }

        .swal2-icon {
            border-width: 2px !important;
            margin-top: 20px !important;
        }

        /* Ajustes para Toasts (pequenos alertas no topo) */
        .swal2-toast {
            padding: 12px 20px !important;
            border-radius: 16px !important;
        }

        .swal2-toast .swal2-title {
            font-size: 16px !important;
            padding-top: 0 !important;
            margin: 0 !important;
        }

        .swal2-toast .swal2-html-container {
            font-size: 14px !important;
            margin-top: 4px !important;
        }
    </style>
</head>

<body>
    <noscript>
        Para este aplicativo funcionar, é necessário habilitar o JavaScript.
    </noscript>

    <div id="root"></div>

    <script src="/pwa-update.js" defer></script>
</body>

</html>
